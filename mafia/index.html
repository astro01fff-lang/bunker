<script>
// ===== РОЛИ =====
const ROLE={
  mafia:{t:'Мафия',side:'m',suit:'♠',d:'Вы в мафии. Ночью вместе с командой выбираете, кого убить: жертвой становится тот, за кого больше голосов. Днём притворяйтесь мирным жителем.'},
  don:{t:'Дон мафии',side:'m',suit:'♣',d:'Вы глава мафии. Ночью голосуете за жертву вместе с командой, при равенстве голосов решает ваш выбор. Ещё каждую ночь проверяете одного игрока: шериф он или нет.'},
  sheriff:{t:'Шериф',side:'t',suit:'♦',d:'Вы на стороне города. Каждую ночь проверяете одного игрока и узнаёте, мафия он или мирный. Делитесь находками днём, но осторожно: мафия охотится за шерифом.'},
  doctor:{t:'Доктор',side:'t',suit:'♥',d:'Вы на стороне города. Каждую ночь лечите одного игрока: если мафия выберет его, он выживет. Себя можно лечить один раз за игру. Одного игрока нельзя лечить две ночи подряд.'},
  civ:{t:'Мирный житель',side:'t',suit:'♥',d:'Вы на стороне города. Ночью спите. Днём слушайте, выставляйте подозреваемых и голосуйте, чтобы выгнать мафию.'}
};
function suggest(n){
  const total=Math.max(1,Math.round(n/4));
  const don=n>=8?1:0;
  return {mafia:total-don,don,sheriff:n>=6?1:0,doctor:n>=7?1:0};
}

// ===== РЕЖИМ ОБЫЧНОГО САЙТА: без сервера и без Claude =====
// Ведущий создаёт комнату, его вкладка становится центром игры.
// Игроки связываются с ней через публичные брокеры сообщений (MQTT поверх WebSocket, обычный HTTPS-порт).
// «База данных» повторяет вызовы Claude (doc/collection/onSnapshot), поэтому код игры одинаков в обоих режимах.
const NET={state:'',peers:0};
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt','wss://mqtt.eclipseprojects.io/mqtt'];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rid=n=>{const A='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<n;i++)s+=A[Math.floor(Math.random()*A.length)];return s};
const netTouch=()=>{try{if(typeof sched==='function')sched()}catch(e){}};
const topicOf=(code,k)=>'mafia20/v1/'+code.toLowerCase()+'/'+k;
function canRead(path,uid){
  if(uid==='host')return true;
  const q=path.split('/'),c=q[0];
  if(c==='g'||c==='votes')return true;
  if(c==='card'||c==='night'||c==='day'||c==='join')return q[1]===uid;
  return false;
}
function canWrite(path,uid){
  if(uid==='host')return true;
  const q=path.split('/');
  return ['join','night','day','votes'].includes(q[0])&&q[1]===uid&&q.length===2;
}

class MQ{
  constructor(url){this.url=url;this.ws=null;this.open=false;this.subs=new Map();this.buf=new Uint8Array(0);this.onclose=null;this.ping=null;this.pid=1}
  static str(s){const b=new TextEncoder().encode(s);const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
  static cat(...a){let n=0;a.forEach(x=>n+=x.length);const o=new Uint8Array(n);let k=0;a.forEach(x=>{o.set(x,k);k+=x.length});return o}
  static pkt(h,body){const l=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;l.push(d)}while(n>0);return MQ.cat(new Uint8Array([h]),new Uint8Array(l),body)}
  connect(ms){
    return new Promise((res,rej)=>{
      let done=false;
      const fin=(ok,err)=>{if(done)return;done=true;clearTimeout(t);if(ok)res();else{try{this.ws&&this.ws.close()}catch(e){}rej(err||new Error('fail'))}};
      const t=setTimeout(()=>fin(false,new Error('timeout')),ms);
      let ws;try{ws=new WebSocket(this.url,'mqtt')}catch(e){fin(false,e);return}
      ws.binaryType='arraybuffer';this.ws=ws;
      ws.onopen=()=>{ws.send(MQ.pkt(0x10,MQ.cat(MQ.str('MQTT'),new Uint8Array([4,2,0,30]),MQ.str('mf'+rid(14)))))};
      ws.onmessage=e=>{
        this.buf=MQ.cat(this.buf,new Uint8Array(e.data));
        for(;;){
          const b=this.buf;if(b.length<2)break;
          let n=0,mul=1,i=1,d;
          do{if(i>=b.length)return;d=b[i++];n+=(d&127)*mul;mul*=128;if(i>5)return}while(d&128);
          if(b.length<i+n)break;
          const body=b.slice(i,i+n),type=b[0]>>4,flags=b[0]&15;
          this.buf=b.slice(i+n);
          if(type===2){if(body[1]===0){this.open=true;this.ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000);fin(true)}else fin(false,new Error('refused'))}
          else if(type===3){
            const tl=(body[0]<<8)|body[1];let k=2+tl;const topic=new TextDecoder().decode(body.slice(2,k));const q=(flags>>1)&3;
            if(q>0){const id=body.slice(k,k+2);k+=2;if(q===1){try{ws.send(new Uint8Array([0x40,2,id[0],id[1]]))}catch(e){}}}
            const cb=this.subs.get(topic);
            if(cb){let m=null;try{m=JSON.parse(new TextDecoder().decode(body.slice(k)))}catch(e){}if(m)try{cb(m)}catch(e){console.error(e)}}
          }
        }
      };
      ws.onerror=()=>{};
      ws.onclose=()=>{const was=this.open;this.open=false;clearInterval(this.ping);if(!done)fin(false,new Error('closed'));else if(was&&this.onclose)this.onclose()};
    });
  }
  sub(topic,cb){this.subs.set(topic,cb);const id=this.pid++;this.ws.send(MQ.pkt(0x82,MQ.cat(new Uint8Array([id>>8&255,id&255]),MQ.str(topic),new Uint8Array([0]))))}
  pub(topic,obj){if(!this.open)return false;try{this.ws.send(MQ.pkt(0x30,MQ.cat(MQ.str(topic),new TextEncoder().encode(JSON.stringify(obj)))));return true}catch(e){return false}}
  close(){this.onclose=null;this.open=false;clearInterval(this.ping);try{this.ws.close()}catch(e){}}
}

function makeShim(role,code){
  const store=new Map(),docL={},colL={},toks={};
  const conns=new Map();
  let ready=role==='host',waiters=[];
  const seg=p=>p.split('/');
  const snapDoc=p=>({id:seg(p)[1],exists:store.has(p),data:()=>store.get(p)});
  const colDocs=c=>[...store.keys()].filter(k=>k.startsWith(c+'/')&&seg(k).length===2).map(k=>({id:k.slice(c.length+1),data:()=>store.get(k)}));
  const fireDoc=p=>{(docL[p]||[]).forEach(f=>{try{f(snapDoc(p))}catch(e){console.error(e)}})};
  const fireCol=c=>{(colL[c]||[]).forEach(f=>{try{f({docs:colDocs(c)})}catch(e){console.error(e)}})};
  const applyLocal=(p,d)=>{if(d==null)store.delete(p);else store.set(p,d);fireDoc(p);fireCol(seg(p)[0])};
  const whenReady=f=>{if(ready)f();else waiters.push(f)};
  let uidv=lsGet('mf-uid'),tokv=lsGet('mf-tok');
  if(!/^p[a-z0-9]{10}$/.test(uidv||'')){uidv='p'+rid(10);lsSet('mf-uid',uidv)}
  if(!tokv||tokv.length<16){tokv=rid(24);lsSet('mf-tok',tokv)}
  const UIDX=uidv,TOK=tokv;

  const links=[];
  let pt=null;
  const persist=()=>{if(role!=='host'||pt)return;pt=setTimeout(()=>{pt=null;lsSet('mf-host',JSON.stringify({code,store:[...store.entries()],toks}))},350)};
  const openLink=()=>links.find(l=>l.mq&&l.mq.open);
  const sendTo=(uid,msg)=>{const c=conns.get(uid);const l=(c&&c.link&&c.link.mq&&c.link.mq.open)?c.link:openLink();if(l)l.mq.pub(topicOf(code,'d/'+uid),msg)};
  const refreshPeers=()=>{const now=Date.now();let n=0;conns.forEach(c=>{if(now-c.t<75000)n++});if(NET.peers!==n){NET.peers=n;netTouch()}};
  const hostWrite=(p,d)=>{
    if(d!=null)d=JSON.parse(JSON.stringify(d));
    applyLocal(p,d);
    const now=Date.now();
    conns.forEach((c,uid)=>{if(now-c.t<600000&&canRead(p,uid))sendTo(uid,{t:'u',p,d:d==null?null:d})});
    persist();
  };
  function hostHandle(link,m){
    if(!m||typeof m.u!=='string'||!/^p[a-z0-9]{10}$/.test(m.u)||typeof m.k!=='string'||m.k.length<8)return;
    const uid=m.u;
    if(toks[uid]&&toks[uid]!==m.k){link.mq.pub(topicOf(code,'d/'+uid),{t:'bad'});return}
    if(m.t==='hi'){
      if(!toks[uid]){toks[uid]=m.k;persist()}
      conns.set(uid,{t:Date.now(),link});refreshPeers();
      link.mq.pub(topicOf(code,'d/'+uid),{t:'snap',docs:[...store.entries()].filter(e=>canRead(e[0],uid))});
      return;
    }
    if(!toks[uid])return;
    const c=conns.get(uid)||{};c.t=Date.now();c.link=link;conns.set(uid,c);
    if(typeof m.p!=='string')return;
    if(!canWrite(m.p,uid)){sendTo(uid,{t:'err',p:m.p});return}
    if(m.t==='set')hostWrite(m.p,m.d);else if(m.t==='del')hostWrite(m.p,null);
  }
  const updNet=()=>{NET.state=openLink()?'ok':'lost';netTouch()};
  function startLink(url){
    const l={url,mq:null,okOnce:false};links.push(l);
    const go=async()=>{
      const mq=new MQ(url);
      try{await mq.connect(8000)}catch(e){setTimeout(go,l.okOnce?3000:8000);return}
      l.mq=mq;l.okOnce=true;
      mq.sub(topicOf(code,'up'),m=>hostHandle(l,m));
      mq.onclose=()=>{updNet();setTimeout(go,2500)};
      updNet();
      mq.pub(topicOf(code,'all'),{t:'host'});
    };
    l.go=go;return l;
  }

  const pend=new Map();
  let cur=null;
  const needConn=()=>{if(!cur||!cur.open)throw new Error('Нет связи с ведущим. Подождите, идёт переподключение.')};
  const upSend=m=>{if(cur&&cur.open)cur.pub(topicOf(code,'up'),Object.assign({u:UIDX,k:TOK},m))};
  const db={
    doc:p=>({
      set:async d=>{
        d=JSON.parse(JSON.stringify(d));
        if(role==='host'){hostWrite(p,d);return}
        if(!canWrite(p,UIDX))throw new Error('Это действие доступно только ведущему.');
        needConn();
        pend.set(p,{t:'set',p,d});upSend({t:'set',p,d});applyLocal(p,d);
      },
      delete:async()=>{
        if(role==='host'){hostWrite(p,null);return}
        if(!canWrite(p,UIDX))throw new Error('Это действие доступно только ведущему.');
        needConn();
        pend.set(p,{t:'del',p});upSend({t:'del',p});applyLocal(p,null);
      },
      get:async()=>snapDoc(p),
      onSnapshot:n=>{(docL[p]=docL[p]||[]).push(n);whenReady(()=>n(snapDoc(p)));return()=>{}}
    }),
    collection:c=>({onSnapshot:n=>{(colL[c]=colL[c]||[]).push(n);whenReady(()=>n({docs:colDocs(c)}));return()=>{}}})
  };
  return {
    code,role,
    use:async n=>{
      if(n==='db')return db;
      if(n==='user')return role==='host'?{isOwner:async()=>true,id:async()=>'host',can:async()=>true}:{isOwner:async()=>false,id:async()=>UIDX,can:async()=>true};
      return null;
    },
    async startHost(restore){
      if(typeof WebSocket==='undefined')throw new Error('Этот браузер не поддерживает нужную связь. Откройте игру в Chrome.');
      if(restore){(restore.store||[]).forEach(e=>store.set(e[0],e[1]));Object.assign(toks,restore.toks||{})}
      BROKERS.forEach(u=>startLink(u).go());
      const t0=Date.now();
      while(!openLink()){
        if(Date.now()-t0>20000)throw new Error('Не удалось выйти в сеть: серверы связи недоступны. Проверьте интернет или попробуйте другую сеть.');
        await new Promise(r=>setTimeout(r,150));
      }
      NET.state='ok';netTouch();
      setInterval(()=>{refreshPeers();updNet()},5000);
    },
    async connectPlayer(){
      if(typeof WebSocket==='undefined')throw new Error('Этот браузер не поддерживает нужную связь. Откройте игру в Chrome.');
      let onSnapFirst=null,dead=false,idx=0;
      const onDown=m=>{
        if(!m)return;
        if(m.t==='snap'){
          store.clear();(m.docs||[]).forEach(e=>store.set(e[0],e[1]));
          pend.forEach((v,p)=>{if(v.t==='set')store.set(p,v.d);else store.delete(p)});
          ready=true;const w=waiters;waiters=[];w.forEach(f=>f());
          Object.keys(docL).forEach(fireDoc);Object.keys(colL).forEach(fireCol);
          NET.state='ok';netTouch();
          pend.forEach(v=>upSend(v));
          if(onSnapFirst){const f=onSnapFirst;onSnapFirst=null;f('snap')}
        }else if(m.t==='u'){
          applyLocal(m.p,m.d);
          const pv=pend.get(m.p);
          if(pv&&JSON.stringify(pv.d==null?null:pv.d)===JSON.stringify(m.d==null?null:m.d))pend.delete(m.p);
        }else if(m.t==='bad'){
          dead=true;NET.state='bad';netTouch();
          if(onSnapFirst){const f=onSnapFirst;onSnapFirst=null;f('bad')}
        }
      };
      const tryBroker=async i=>{
        const mq=new MQ(BROKERS[i]);
        await mq.connect(5000);
        mq.sub(topicOf(code,'d/'+UIDX),onDown);
        mq.sub(topicOf(code,'all'),m=>{if(m&&m.t==='host'&&cur===mq){upSend({t:'hi'});pend.forEach(v=>upSend(v))}});
        return mq;
      };
      const keepAlive=()=>{
        const reconnect=async()=>{
          if(dead)return;
          NET.state='lost';netTouch();
          for(let k=0;k<BROKERS.length&&!dead;k++){
            const i=(idx+k)%BROKERS.length;
            try{const mq=await tryBroker(i);idx=i;cur=mq;mq.onclose=reconnect;mq.pub(topicOf(code,'up'),{t:'hi',u:UIDX,k:TOK});return}catch(e){}
          }
          setTimeout(reconnect,3000);
        };
        cur.onclose=reconnect;
        setInterval(()=>{if(cur&&cur.open)upSend({t:'hi'})},25000);
        setInterval(()=>{if(cur&&cur.open)pend.forEach(v=>upSend(v))},4000);
      };
      let sawConn=false;
      for(let i=0;i<BROKERS.length;i++){
        let mq;
        try{mq=await tryBroker(i)}catch(e){continue}
        sawConn=true;
        const r=await new Promise(res=>{
          onSnapFirst=res;
          mq.pub(topicOf(code,'up'),{t:'hi',u:UIDX,k:TOK});
          setTimeout(()=>{if(onSnapFirst===res){onSnapFirst=null;res('none')}},3000);
        });
        if(r==='snap'){idx=i;cur=mq;keepAlive();return}
        mq.close();
        if(r==='bad')throw new Error('Это устройство не подошло: комната считает ваше место занятым другим браузером. Откройте игру в том же браузере, где вы вошли в первый раз.');
      }
      throw new Error(sawConn?'Не нашла комнату с таким кодом. Проверьте код и убедитесь, что ведущий открыл игру.':'Не удалось связаться с серверами игры. Проверьте интернет. Если включён VPN или корпоративная сеть, попробуйте выключить их или сменить сеть.');
    }
  };
}

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const newCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[rnd(A.length)];return s};

let db=null,user=null,UID=null,IS_HOST=false,CAN_WRITE=null,MODE='boot',COPYBOX='',HIDE=lsGet('mf-hide')==='1';

const wq={};

function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},3400)}
function fail(e){console.error(e);const c=e&&e.code;toast(c==='invalid_argument'||c==='permission_denied'?'Нет права записи. Попросите ведущего выдать доступ с правом взаимодействия.':(e&&e.message?'Не получилось: '+e.message:'Не получилось сохранить'),true)}
async function guard(fn){try{await fn()}catch(e){fail(e)}}

async function saveS(){S.rev=(S.rev||0)+1;await W('g/state',S)}
async function saveSE(){SE.rev=(SE.rev||0)+1;await W('host/secret',SE)}
async function saveCards(C){for(const id of Object.keys(C)){const j=JSON.stringify(C[id]);if(LASTC[id]!==j){LASTC[id]=j;await W('card/'+id,C[id])}}}

  S=res.S;SE=res.SE;if(res.C)CARDS=res.C;

let lastHTML='',RT=null;
function sched(){if(RT)return;RT=setTimeout(()=>{RT=null;render()},40)}
function render(){
  try{soundSync()}catch(e){}
  const root=$('#app');let html;
  try{html=view()}catch(e){console.error(e);html='<p class="note">Ошибка отображения: '+esc(e.message)+'</p>'}
  const sl=$('#subline');if(sl)sl.textContent=S&&S.code&&MODE==='ok'?'Комната '+S.code:'Классическая игра онлайн, до 20 игроков';
  if(html===lastHTML)return;
  lastHTML=html;
  const keep={},kdef={};
  root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{keep[e.id]=e.type==='checkbox'?e.checked:e.value;if(e.dataset.def!==undefined)kdef[e.id]=e.dataset.def});
  const af=document.activeElement,fid=af&&af.id&&root.contains(af)?af.id:null;
  const ss=fid&&af.selectionStart!=null?[af.selectionStart,af.selectionEnd]:null;
  const sy=window.scrollY;
  root.innerHTML=html;
  Object.keys(keep).forEach(id=>{
    const e=document.getElementById(id);if(!e||e.dataset.live!==undefined)return;
    if(kdef[id]!==undefined&&keep[id]===kdef[id])return;
    if(e.type==='checkbox')e.checked=keep[id];
    else if(e.tagName==='SELECT'){if([].some.call(e.options,o=>o.value===keep[id]))e.value=keep[id]}
    else e.value=keep[id];
  });
  if(fid){const e=document.getElementById(fid);if(e){try{e.focus();if(ss&&e.setSelectionRange)e.setSelectionRange(ss[0],ss[1])}catch(_){}}}
  window.scrollTo(0,sy);tick();
}
function tick(){document.querySelectorAll('[data-end]').forEach(e=>{const s=Math.max(0,Math.round((+e.dataset.end-Date.now())/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')})}
setInterval(tick,1000);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=H[b.dataset.act];if(f)guard(()=>f(b.dataset,b))});
document.addEventListener('change',e=>{const b=e.target.closest('[data-chg]');if(!b)return;const f=H[b.dataset.chg];if(f)guard(()=>f(b.dataset,b))});

function adopt(d){if(IS_HOST){if(d&&(!S||(d.rev||0)>(S.rev||0)))S=d}else S=d}
function onErr(e){console.error(e)}
function snapMap(set){return q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});set(m);sched();if(IS_HOST)hostReact()}}
function sub(){
  db.doc('g/state').onSnapshot(s=>{adopt(s.exists?clone(s.data()):null);sched()},onErr);
  db.collection('votes').onSnapshot(snapMap(m=>{VOTES=m}),onErr);
  if(IS_HOST){
    db.doc('host/secret').onSnapshot(s=>{const d=s.exists?clone(s.data()):null;if(d&&(!SE||(d.rev||0)>(SE.rev||0)))SE=d;sched()},onErr);
    db.collection('card').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=clone(d.data());LASTC[d.id]=JSON.stringify(m[d.id])});CARDS=m;sched()},onErr);
    db.collection('join').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});JOINS=m;syncLobby();sched()},onErr);
    db.collection('night').onSnapshot(snapMap(m=>{NIGHT=m}),onErr);
    db.collection('day').onSnapshot(snapMap(m=>{DAY=m}),onErr);
  }else{
    db.doc('card/'+UID).onSnapshot(s=>{CARD=s.exists?clone(s.data()):null;sched()},onErr);
    db.doc('night/'+UID).onSnapshot(s=>{if(s.exists)NIGHT[UID]=s.data();sched()},onErr);
    db.doc('day/'+UID).onSnapshot(s=>{if(s.exists)DAY[UID]=s.data();sched()},onErr);
    db.doc('join/'+UID).onSnapshot(s=>{if(s.exists)JOINS[UID]=s.data();sched()},onErr);
  }
}
function syncLobby(){
  if(!IS_HOST||!S||S.phase!=='lobby')return;
  const old=S.lobby||[],ban=S.ban||[],out=[];
  old.filter(x=>x.manual||x.bot).forEach(x=>out.push(x));
  Object.keys(JOINS).forEach(id=>{
    if(ban.includes(id))return;
    const j=JOINS[id];if(!j||j.code!==S.code)return;
    const nm=String(j.name||'').trim().slice(0,24)||'Игрок',ex=old.find(x=>x.id===id);
    if(!ex){S.oseq=(S.oseq||0)+1;out.push({id,name:nm,ord:S.oseq})}
    else out.push({id,name:nm,ord:ex.ord});
  });
  out.sort((a,b)=>a.ord-b.ord);
  if(JSON.stringify(out)!==JSON.stringify(old)){S.lobby=out;guard(saveS)}
}
async function boot(){
  render();

    if(!CL||!CL.use){MODE='choose';render();return}
    user=await CL.use('user');db=await CL.use('db');

const act=id=>{const a=NIGHT[id];return a&&S&&a.gid===S.gid&&a.round===S.round?a:null};
const dayAct=id=>{const a=DAY[id];return a&&S&&a.gid===S.gid&&a.round===S.round?a:null};
function tally(){
  const m={};
  if(!S)return m;
  Object.keys(VOTES).forEach(id=>{
    const v=VOTES[id];const p=P(id);
    if(!v||!p||!p.alive||v.gid!==S.gid||v.round!==S.round||v.vr!==S.vr||!S.noms.includes(v.target))return;
    (m[v.target]=m[v.target]||[]).push(id);
  });
  return m;
}
function order(s){const al=s.players.filter(p=>p.alive);if(!al.length)return[];const off=(s.round-1)%al.length;return al.slice(off).concat(al.slice(0,off)).map(p=>p.id)}

// ===== ВЕДУЩИЙ: реакции на ходы игроков =====
let reacting=false,again=false;
async function hostReact(){
  if(!IS_HOST||!S||!SE||!S.gid)return;
  if(reacting){again=true;return}
  reacting=true;
  try{
    const C=clone(CARDS);let cch=false,sch=false;
    if(S.phase==='night'&&!intro()){
      const picks={};
      S.players.filter(p=>p.alive&&sideOf(p.id)==='m').forEach(p=>{const a=act(p.id);if(a&&a.kill)picks[p.id]=a.kill});
      S.players.filter(p=>sideOf(p.id)==='m').forEach(p=>{const c=C[p.id];if(!c)return;const nv={round:S.round,picks};if(JSON.stringify(c.mv)!==JSON.stringify(nv)){c.mv=nv;cch=true}});
      ['don','sheriff'].forEach(r=>{
        const p=S.players.find(x=>x.alive&&roleOf(x.id)===r);if(!p)return;
        const a=act(p.id),c=C[p.id];if(!a||!a.check||!c)return;
        if(c.inbox.some(m=>m.round===S.round&&m.kind==='check'))return;
        const t=P(a.check);if(!t||t.id===p.id)return;
        const txt=r==='don'?(roleOf(t.id)==='sheriff'?tag(t)+' — шериф.':tag(t)+' — не шериф.'):(sideOf(t.id)==='m'?tag(t)+' — мафия.':tag(t)+' — мирный житель.');
        c.inbox.push({round:S.round,kind:'check',target:t.id,text:txt});cch=true;
      });
    }
    if(S.phase==='day'){
      const by=S.nomBy.slice();
      Object.keys(DAY).forEach(id=>{
        const d=dayAct(id),p=P(id);if(!d||!d.nom||!p||!p.alive)return;
        if(by.some(x=>x.by===id))return;
        const t=P(d.nom);if(!t||!t.alive)return;
        by.push({by:id,target:t.id});
      });
      if(by.length!==S.nomBy.length){
        S.nomBy=by;
        by.forEach(x=>{if(!S.noms.includes(x.target)&&!(S.nomOff||[]).includes(x.target))S.noms.push(x.target)});
        sch=true;
      }
    }
    if(cch){CARDS=C;await saveCards(C)}
    if(sch){lastHTML='';render();await saveS()}
  }catch(e){console.error(e)}
  finally{reacting=false;if(again){again=false;hostReact()}}
}

function freshState(old){
  return {v:1,gid:'',code:old&&old.code?old.code:(window.__p2p?window.__p2p.code:newCode()),rev:old?old.rev:0,phase:'lobby',round:0,
    cfg:old?old.cfg:{peace:true,nightSec:60,speech:60,voteSec:45,roles:null},
    players:[],lobby:[],ban:old?(old.ban||[]):[],oseq:old?(old.oseq||0):0,news:[],timerEnd:null,
    order:[],spk:-1,noms:[],nomBy:[],nomOff:[],vr:1,result:null,winner:null,reveal:null};
}
H.createGame=async()=>{S=freshState(null);SE={rev:0,roles:{},lastHeal:null,selfHeal:false,hlog:[]};lastHTML='';render();await saveSE();await saveS();syncLobby()};
function cfgRoles(n){return S.cfg.roles||suggest(n)}
H.cfg=(d,el)=>{
  const k=d.k;
  if(['mafia','don','sheriff','doctor'].includes(k)){
    const n=Math.min(20,S.lobby.length);const r=Object.assign({},cfgRoles(n));
    r[k]=Math.max(0,Math.min(k==='mafia'?8:1,parseInt(el.value)||0));S.cfg.roles=r;
  }else if(k==='peace')S.cfg.peace=el.checked;
  else S.cfg[k]=Math.max(15,Math.min(600,parseInt(el.value)||S.cfg[k]));
  lastHTML='';render();return saveS();
};
H.autoRoles=()=>{S.cfg.roles=null;lastHTML='';render();return saveS()};
H.kick=d=>{S.ban=(S.ban||[]).concat(d.id);S.lobby=S.lobby.filter(x=>x.id!==d.id);lastHTML='';render();return saveS()};
H.addManual=()=>{
  const nm=(val('mname')||'').trim().slice(0,24);if(!nm){toast('Введите имя',true);return}
  S.oseq=(S.oseq||0)+1;S.lobby.push({id:'m'+rid(10),name:nm,ord:S.oseq,manual:true});
  const e=document.getElementById('mname');if(e)e.value='';
  lastHTML='';render();return saveS();
};
const BOTN=['Аня','Борис','Вика','Глеб','Даша','Егор','Женя','Зоя','Илья','Кира','Лёша','Маша','Ника','Оля','Паша','Рита','Саша','Таня','Уля','Федя'];
H.addBots=d=>{
  const want=d.n==='fill'?20-S.lobby.length:+d.n;let k=0;
  for(const nm of BOTN){if(k>=want||S.lobby.length>=20)break;const name='Бот '+nm;if(S.lobby.some(x=>x.name===name))continue;S.oseq=(S.oseq||0)+1;S.lobby.push({id:'b'+rid(10),name,ord:S.oseq,bot:true});k++}
  if(!k){toast('За столом уже 20 мест',true);return}
  lastHTML='';render();return saveS();
};
H.dropBots=()=>{S.lobby=S.lobby.filter(x=>!x.bot);lastHTML='';render();return saveS()};
// боты: ходят сами, ведущий только переключает фазы
let botBusy=false;
async function botTick(){
  if(!IS_HOST||!S||!SE||!S.gid||botBusy||!['night','day','vote'].includes(S.phase))return;
  botBusy=true;
  try{
    const bots=S.players.filter(p=>p.bot&&p.alive);if(!bots.length)return;
    const al=alive(),pick=a=>a[rnd(a.length)];
    if(S.phase==='night'&&!intro()){
      for(const p of bots){
        const r=roleOf(p.id);if(r==='civ'||act(p.id)||Math.random()<.5)continue;
        const a={gid:S.gid,round:S.round,t:Date.now()},others=al.filter(x=>x.id!==p.id);
        if(ROLE[r].side==='m'){
          const tg=others.filter(x=>sideOf(x.id)!=='m');
          const team=al.filter(x=>x.id!==p.id&&sideOf(x.id)==='m').map(x=>act(x.id)).filter(x=>x&&x.kill);
          if(team.length&&Math.random()<.75)a.kill=team[0].kill;else if(tg.length)a.kill=pick(tg).id;
        }
        if(r==='don'||r==='sheriff'){const c=others.filter(x=>r==='don'?sideOf(x.id)!=='m':true);if(c.length)a.check=pick(c).id}
        if(r==='doctor'){const c=al.filter(x=>x.id!==SE.lastHeal&&!(x.id===p.id&&SE.selfHeal));if(c.length)a.heal=pick(c).id}
        NIGHT[p.id]=a;await W('night/'+p.id,a);
      }
    }
    if(S.phase==='day'&&S.spk>=0){
      for(const p of bots){
        if(dayAct(p.id)||S.noms.length>=3||Math.random()<.85)continue;
        const o=al.filter(x=>x.id!==p.id);if(!o.length)continue;
        const d={gid:S.gid,round:S.round,nom:pick(o).id,t:Date.now()};DAY[p.id]=d;await W('day/'+p.id,d);
      }
    }
    if(S.phase==='vote'){
      for(const p of bots){
        const v=VOTES[p.id];if(v&&v.gid===S.gid&&v.round===S.round&&v.vr===S.vr)continue;
        if(Math.random()<.5)continue;
        const c=S.noms.filter(x=>x!==p.id);if(!c.length)continue;
        const nv={gid:S.gid,round:S.round,vr:S.vr,target:pick(c),t:Date.now()};VOTES[p.id]=nv;await W('votes/'+p.id,nv);
      }
      sched();
    }
  }catch(e){console.error(e)}
  finally{botBusy=false}
}
setInterval(botTick,1200);
H.start=async()=>{
  const lob=S.lobby.slice(0,20),n=lob.length;
  if(n<4){toast('Нужно минимум 4 игрока',true);return}
  const r=cfgRoles(n);
  const roles=[];for(let i=0;i<r.mafia;i++)roles.push('mafia');
  if(r.don)roles.push('don');if(r.sheriff)roles.push('sheriff');if(r.doctor)roles.push('doctor');
  if(roles.length>=n){toast('Особых ролей больше, чем игроков',true);return}
  if(r.mafia+r.don<1){toast('Нужна хотя бы одна мафия',true);return}
  while(roles.length<n)roles.push('civ');
  shuffle(roles);
  const s=clone(S),se={rev:SE?SE.rev:0,roles:{},lastHeal:null,selfHeal:false,hlog:[]},C={};
  s.gid=rid(8);s.players=lob.map((x,i)=>({id:x.id,name:x.name,n:i+1,alive:true,manual:!!x.manual,bot:!!x.bot}));
  s.players.forEach((p,i)=>{se.roles[p.id]=roles[i]});
  s.players.forEach(p=>{
    const role=se.roles[p.id],m=ROLE[role].side==='m';
    C[p.id]={gid:s.gid,pid:p.id,n:p.n,role,team:m?s.players.filter(x=>x.id!==p.id&&ROLE[se.roles[x.id]].side==='m').map(x=>({id:x.id,role:se.roles[x.id]})):[],inbox:[],mv:null,lastHeal:null,selfUsed:false};
  });
  Object.assign(s,{phase:'night',round:1,news:[],timerEnd:Date.now()+s.cfg.nightSec*1000,order:[],spk:-1,noms:[],nomBy:[],nomOff:[],vr:1,result:null,winner:null,reveal:null});
  s.news.push({round:1,text:'Игра началась: '+n+' игроков, мафии '+(r.mafia+r.don)+'. '+(s.cfg.peace?'Первая ночь ознакомительная: мафия знакомится, никто не погибает.':'Город засыпает.')});
  se.hlog.push({round:1,text:'Роли розданы.'});
  await commit({S:s,SE:se,C});
};
function winCheck(s,se){
  const al=s.players.filter(p=>p.alive),m=al.filter(p=>ROLE[se.roles[p.id]].side==='m').length,t=al.length-m;
  let w=null;if(m===0)w='t';else if(m>=t)w='m';
  if(!w)return false;
  s.phase='over';s.winner=w;s.reveal=clone(se.roles);s.timerEnd=null;
  s.news.push({round:s.round,text:w==='m'?'Мафия захватила город. Победила мафия.':'Вся мафия раскрыта. Победил город.'});
  return true;
}
H.morning=async()=>{
  const s=clone(S),se=clone(SE),C=clone(CARDS),r=s.round;
  if(r===1&&s.cfg.peace){
    s.news.push({round:r,text:'Утро. Ознакомительная ночь прошла, все живы.'});
  }else{
    const maf=s.players.filter(p=>p.alive&&ROLE[se.roles[p.id]].side==='m');
    const cnt={};maf.forEach(p=>{const a=act(p.id);const t=a&&a.kill&&s.players.find(x=>x.id===a.kill);if(t&&t.alive)cnt[t.id]=(cnt[t.id]||0)+1});
    let kill=null;const ks=Object.keys(cnt);
    if(ks.length){
      const mx=Math.max(...ks.map(k=>cnt[k])),tops=ks.filter(k=>cnt[k]===mx);
      if(tops.length===1)kill=tops[0];
      else{const don=maf.find(p=>se.roles[p.id]==='don');const dk=don&&act(don.id)?act(don.id).kill:null;kill=tops.includes(dk)?dk:tops[rnd(tops.length)]}
    }
    const doc=s.players.find(p=>p.alive&&se.roles[p.id]==='doctor');let heal=null;
    if(doc){const a=act(doc.id);if(a&&a.heal&&a.heal!==se.lastHeal&&!(a.heal===doc.id&&se.selfHeal))heal=a.heal}
    se.lastHeal=heal;if(doc&&heal===doc.id)se.selfHeal=true;
    if(doc&&C[doc.id]){C[doc.id].lastHeal=se.lastHeal;C[doc.id].selfUsed=se.selfHeal}
    const nm=id=>tag(s.players.find(x=>x.id===id));
    if(heal)se.hlog.push({round:r,text:'Доктор лечил '+nm(heal)+'.'});
    if(kill&&kill!==heal){
      const v=s.players.find(x=>x.id===kill);v.alive=false;
      se.hlog.push({round:r,text:'Мафия убила '+nm(kill)+'.'});
      s.news.push({round:r,text:'Ночь '+r+': убит игрок '+tag(v)+'. Последнее слово, 30 секунд.'});
    }else{
      se.hlog.push({round:r,text:kill?'Мафия стреляла в '+nm(kill)+', доктор спас.':'Мафия никого не выбрала.'});
      s.news.push({round:r,text:'Ночь '+r+': никто не погиб.'});
    }
  }
  s.phase='day';s.timerEnd=null;s.order=order(s);s.spk=-1;s.noms=[];s.nomBy=[];s.nomOff=[];s.vr=1;s.result=null;
  winCheck(s,se);
  await commit({S:s,SE:se,C});
};
H.speaker=d=>{
  const s=clone(S);const len=s.order.length;
  s.spk=Math.max(0,Math.min(len-1,s.spk+(+d.dir)));
  s.timerEnd=Date.now()+s.cfg.speech*1000;
  return commit({S:s,SE});
};
H.restartSpeech=()=>{const s=clone(S);s.timerEnd=Date.now()+s.cfg.speech*1000;return commit({S:s,SE})};
H.unnom=d=>{const s=clone(S);s.noms=s.noms.filter(x=>x!==d.id);s.nomOff=(s.nomOff||[]).concat(d.id);return commit({S:s,SE})};
H.hostNom=()=>{const id=val('hnom');if(!id)return;const s=clone(S);if(!s.noms.includes(id))s.noms.push(id);s.nomOff=(s.nomOff||[]).filter(x=>x!==id);return commit({S:s,SE})};
H.toVote=()=>{const s=clone(S);s.phase='vote';s.timerEnd=Date.now()+s.cfg.voteSec*1000;return commit({S:s,SE})};
H.closeVote=()=>{
  const s=clone(S),se=clone(SE),t=tally();
  let mx=0,tops=[];
  s.noms.forEach(id=>{const v=(t[id]||[]).length;if(v>mx){mx=v;tops=[id]}else if(v===mx&&v>0)tops.push(id)});
  if(mx===0){s.result={type:'none'};s.news.push({round:s.round,text:'День '+s.round+': никто не набрал голосов, город никого не выгнал.'})}
  else if(tops.length===1){
    const v=s.players.find(x=>x.id===tops[0]);v.alive=false;s.result={type:'out',id:v.id,votes:mx};
    s.news.push({round:s.round,text:'День '+s.round+': город выгнал игрока '+tag(v)+' ('+mx+' гол.). Последнее слово, 30 секунд.'});
    se.hlog.push({round:s.round,text:'Город выгнал '+tag(v)+', роль: '+ROLE[se.roles[v.id]].t+'.'});
  }else{s.result={type:'tie',ids:tops,votes:mx}}
  s.phase='result';s.timerEnd=null;
  if(s.result.type==='out')winCheck(s,se);
  return commit({S:s,SE:se});
};
H.revote=()=>{const s=clone(S);s.noms=s.result.ids.slice();s.vr++;s.result=null;s.phase='vote';s.timerEnd=Date.now()+s.cfg.voteSec*1000;return commit({S:s,SE})};
H.noOne=()=>{const s=clone(S);s.result={type:'none'};s.news.push({round:s.round,text:'День '+s.round+': ничья, город никого не выгнал.'});return commit({S:s,SE})};
H.toNight=()=>{const s=clone(S);s.round++;s.phase='night';s.result=null;s.noms=[];s.nomBy=[];s.timerEnd=Date.now()+s.cfg.nightSec*1000;return commit({S:s,SE})};
H.toggleAlive=d=>{
  const s=clone(S),se=clone(SE),p=s.players.find(x=>x.id===d.id);p.alive=!p.alive;
  se.hlog.push({round:s.round,text:(p.alive?'Вернул в игру ':'Убрал из игры ')+tag(p)+'.'});
  s.news.push({round:s.round,text:p.alive?'Игрок '+tag(p)+' вернулся в игру.':'Игрок '+tag(p)+' покинул игру.'});
  if(s.phase==='day'){s.order=s.order.filter(id=>s.players.find(x=>x.id===id).alive);s.spk=Math.min(s.spk,s.order.length-1)}
  winCheck(s,se);
  return commit({S:s,SE:se});
};
H.again=()=>{const s=freshState(S);s.lobby=[];S=s;lastHTML='';render();syncLobby();return saveS()};

H.mNight=(d,el)=>{const a=Object.assign({},NIGHT[d.id]&&act(d.id)?NIGHT[d.id]:{gid:S.gid,round:S.round});a[d.f]=el.value;a.t=Date.now();NIGHT[d.id]=a;return W('night/'+d.id,a)};
H.mVote=(d,el)=>{const v={gid:S.gid,round:S.round,vr:S.vr,target:el.value,t:Date.now()};VOTES[d.id]=v;sched();return W('votes/'+d.id,v)};
H.copyCard=d=>copyText(cardText(d.id),'Текст роли скопирован');
function cardText(id){
  const p=P(id),r=roleOf(id),ro=ROLE[r];
  let t='МАФИЯ. Ваша роль (никому не показывайте)\n\n'+p.name+', ваш номер в игре: '+p.n+'.\nРоль: '+ro.t+'.\n'+ro.d+'\n';
  if(ro.side==='m'){const team=S.players.filter(x=>x.id!==id&&sideOf(x.id)==='m');if(team.length)t+='\nВаша команда: '+team.map(x=>tag(x)+(roleOf(x.id)==='don'?' (дон)':'')).join(', ')+'.\n'}
  t+='\nНочные ходы присылайте ведущему в личные сообщения.';

function copyText(text,ok){

  const fb=()=>{COPYBOX=text;lastHTML='';render();toast('Скопируйте текст из поля ниже',true)};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
H.closeCopy=()=>{COPYBOX='';lastHTML='';render()};
H.copyInvite=()=>{

const PH={lobby:'Сбор игроков',night:'Ночь',day:'День',vote:'Голосование',result:'Итог дня',over:'Конец игры'};
const roleBadge=r=>'<span class="role '+ROLE[r].side+'">'+esc(ROLE[r].t)+'</span>';
function netPill(){
  if(!window.__p2p)return '';
  const st=NET.state;
  if(window.__p2p.role==='host')return '<span class="pill '+(st==='ok'?'ok':'wait')+'">'+(st==='ok'?'Игроков на связи: '+NET.peers:'Нет сети, переподключаюсь…')+'</span>';
  return '<span class="pill '+(st==='ok'?'ok':'wait')+'">'+(st==='ok'?'Связь с ведущим есть':'Связь потеряна, переподключаюсь…')+'</span>';
}
function topbar(){
  let st='';
  if(S){
    if(S.phase==='lobby'||S.phase==='over')st='<span class="step on">'+PH[S.phase]+'</span>';
    else st=['night','day','vote','result'].map(k=>'<span class="step'+(S.phase===k?' on':'')+'">'+PH[k]+'</span>').join('');
  }
  const rd=S&&S.phase!=='lobby'?'<span class="mono muted">Круг '+S.round+'</span>':'';
  const tm=S&&S.timerEnd&&['night','day','vote'].includes(S.phase)?'<span class="timer" data-end="'+S.timerEnd+'">0:00</span>':'';
  return '<div class="statusbar"><div class="steps">'+st+'</div>'+rd+netPill()+tm+'</div>';
}
function copyBox(){return COPYBOX?'<section class="panel hot"><h2>Текст для копирования</h2><textarea readonly id="copybox" data-live>'+esc(COPYBOX)+'</textarea><div class="fields" style="margin-top:10px"><button class="btn sm" data-act="closeCopy">Закрыть</button></div></section>':''}
function newsPanel(){
  const items=S.news.slice().reverse();
  return '<section class="panel"><h2>Новости города</h2>'+(items.length?'<div class="news">'+items.map(x=>'<p><b>Круг '+x.round+'</b>'+esc(x.text)+'</p>').join('')+'</div>':'<p class="muted">Пока тихо.</p>')+'</section>';
}
function playersPanel(){
  const t=S.phase==='vote'||S.phase==='result'?tally():{};
  const spk=S.phase==='day'&&S.spk>=0?S.order[S.spk]:null;
  const host=IS_HOST;
  const rows=S.players.map(p=>{
    let tags='';
    if(!p.alive)tags+='<span class="tag">выбыл</span>';
    if(p.id===spk)tags+='<span class="tag gold">говорит</span>';
    if((S.phase==='day'||S.phase==='vote')&&S.noms.includes(p.id)){const by=S.nomBy.filter(x=>x.target===p.id).map(x=>'№'+(P(x.by)||{}).n);tags+='<span class="tag red">выставлен'+(by.length?' ('+by.join(', ')+')':'')+'</span>'}
    if(S.phase==='vote'&&S.noms.includes(p.id))tags+='<span class="tag gold">'+(t[p.id]||[]).length+' гол.</span>';
    if(S.reveal&&S.reveal[p.id])tags+=roleBadge(S.reveal[p.id]);
    else if(host&&roleOf(p.id))tags+=roleBadge(roleOf(p.id));
    if(host&&p.manual)tags+='<span class="tag">без сайта</span>';
    if(host&&p.bot)tags+='<span class="tag gold">бот</span>';
    const tools=host&&S.phase!=='over'?'<button class="btn sm ghost" data-act="toggleAlive" data-id="'+p.id+'">'+(p.alive?'Убрать':'Вернуть')+'</button>'+(p.manual?'<button class="btn sm ghost" data-act="copyCard" data-id="'+p.id+'">Текст роли</button>':''):'';
    return '<div class="row'+(p.alive?'':' dead')+(p.id===spk?' speaking':'')+'"><span class="seat">'+p.n+'</span><span class="pname grow">'+esc(p.name)+(p.id===UID?' <span class="muted">(вы)</span>':'')+'</span>'+tags+tools+'</div>';
  }).join('');
  return '<section class="panel"><h2>За столом</h2><p class="small muted" style="margin-bottom:6px">Живых: '+alive().length+' из '+S.players.length+'</p><div class="list">'+rows+'</div></section>';
}
function opts(list,v,dis){
  return '<option value="">— выберите —</option>'+list.map(p=>{const d=dis?dis(p):'';return '<option value="'+p.id+'"'+(v===p.id?' selected':'')+(d?' disabled':'')+'>№'+p.n+' '+esc(p.name)+(d?' ('+d+')':'')+'</option>'}).join('');
}

  L+='<h3 style="margin-top:16px">Время</h3><div class="fields"><label>Ночь, сек<input type="number" id="c-night" data-chg="cfg" data-k="nightSec" min="15" value="'+S.cfg.nightSec+'" data-live></label><label>Речь, сек<input type="number" id="c-speech" data-chg="cfg" data-k="speech" min="15" value="'+S.cfg.speech+'" data-live></label><label>Голосование, сек<input type="number" id="c-vote" data-chg="cfg" data-k="voteSec" min="15" value="'+S.cfg.voteSec+'" data-live></label></div>';

  }else{
    const maf=al.filter(p=>sideOf(p.id)==='m');

    h+='<h3>Мафия</h3><div class="list">'+maf.map(p=>{const a=act(p.id);return '<div class="row"><span class="seat">'+p.n+'</span><span class="grow">'+esc(p.name)+' '+roleBadge(r(p.id))+'</span>'+(p.manual?manualSel(p,'kill',al.filter(x=>x.id!==p.id)):'<span class="'+(a&&a.kill?'':'muted')+'">'+(a&&a.kill?'→ '+esc(tag(P(a.kill))):'ещё не выбрал')+'</span>')+'</div>'}).join('')+'</div>';

H.vote=async d=>{const v={gid:S.gid,round:S.round,vr:S.vr,target:d.id,t:Date.now()};VOTES[UID]=v;lastHTML='';render();await W('votes/'+UID,v)};
function playerAction(me){
  if(S.phase==='over')return '';
  if(!me.alive)return '<section class="panel"><h2>Вы выбыли</h2><p class="muted">Можно наблюдать за игрой. Подсказывать живым нельзя.</p></section>';
  if(S.phase==='night')return '<section class="panel hot"><h2>Ночь '+S.round+'</h2><div class="stack">'+nightForm(me)+'</div></section>';
  if(S.phase==='day'){
    const spk=S.spk>=0?P(S.order[S.spk]):null,mine=spk&&spk.id===UID;
    let h='<section class="panel hot"><h2>День '+S.round+'</h2>';
    h+=mine?'<p class="result" style="margin-bottom:12px">Ваша речь! Включите микрофон.</p>':'<p style="margin-bottom:12px">'+(spk?'Говорит '+esc(tag(spk)):'Ведущий скоро даст слово первому игроку.')+'</p>';
    const d=dayAct(UID),acc=S.nomBy.find(x=>x.by===UID);
    if(acc)h+='<p>Вы выставили <b>'+esc(tag(P(acc.target)))+'</b>.</p>';
    else if(d&&d.nom)h+='<p class="muted">Кандидат отправлен ведущему.</p>';
    else h+='<h3>Выставить кандидата</h3><p class="small muted" style="margin-bottom:8px">Можно выставить одного игрока за день.</p><div class="fields"><label class="grow">Игрок<select id="pnom">'+opts(alive().filter(p=>p.id!==UID),'')+'</select></label><button class="btn" data-act="nominate">Выставить</button></div>';
    return h+'</section>';
  }
  if(S.phase==='vote'){
    const v=VOTES[UID],cur=v&&v.gid===S.gid&&v.round===S.round&&v.vr===S.vr?v.target:'';
    return '<section class="panel hot"><h2>Голосование</h2><p class="muted" style="margin-bottom:10px">За кого вы голосуете? Голос можно менять до конца голосования.</p><div class="vbtns">'+S.noms.map(id=>{const p=P(id);return '<button class="vbtn'+(cur===id?' on':'')+'" data-act="vote" data-id="'+id+'"><span class="seat">'+p.n+'</span>'+esc(p.name)+'</button>'}).join('')+'</div><div style="margin-top:14px">'+tallyHTML(tally())+'</div></section>';
  }
  if(S.phase==='result')return '<section class="panel hot"><h2>Итог дня '+S.round+'</h2><p class="result">'+esc(resultText())+'</p></section>';
  return '';
}
function playerView(){
  if(S.phase==='lobby')return playerLobby();
  const me=P(UID);
  if(!me)return topbar()+'<section class="panel hot" style="margin-bottom:20px"><h2>Вы наблюдатель</h2><p>Игра уже идёт, вас нет за столом. Можно следить за ходом игры.</p></section><div class="grid"><div class="col">'+(S.phase==='over'?overBanner():'')+newsPanel()+'</div><div class="col">'+playersPanel()+'</div></div>';
  if(!CARD||CARD.gid!==S.gid)return topbar()+'<p class="muted">Загружаю вашу роль…</p>';
  return topbar()+'<div class="grid"><div class="col">'+playerAction(me)+(S.phase==='over'?overBanner():'')+newsPanel()+'</div><div class="col">'+myCard(me)+playersPanel()+'</div></div>';
}

// ===== МУЗЫКА: синтезируется в браузере, у каждой фазы своя =====
function createMusic(ctx,dest){
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const R=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.floor(Math.random()*a.length)];
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const noise=()=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;return s};
  function tone(bus,t,n,type,v,a,d,cut){
    const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type=type;o.frequency.value=typeof n==='number'&&n<200?hz(n):n;f.type='lowpass';
    f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(Math.max(180,cut*.25),t+a+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
    o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+a+d+.05);
  }
  const piano=(b,t,n,v=.08,d=1.6)=>{tone(b,t,n,'triangle',v,.004,d,2600);tone(b,t,n+12,'sine',v*.3,.004,d*.5,3200)};
  const bass=(b,t,n,v=.24,d=.55)=>{tone(b,t,n,'sine',v,.008,d,700);tone(b,t,n,'triangle',v*.35,.008,d*.6,500)};
  const pluck=(b,t,n,v=.07,d=.5)=>tone(b,t,n,'sawtooth',v,.003,d,3000);
  const nz=(b,t,type,fq,q,v,d)=>{const s=noise(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type=type;f.frequency.value=fq;f.Q.value=q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(b);s.start(t,R(0,1.5));s.stop(t+d+.05)};
  const brush=(b,t,v=.035)=>nz(b,t,'bandpass',2800,.8,v,.2);
  const ride=(b,t,v=.02)=>nz(b,t,'highpass',7500,.5,v,.25);
  const tick=(b,t,v=.025)=>nz(b,t,'highpass',5000,1,v,.03);
  const thump=(b,t,v=.5,f=58)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(b);o.start(t);o.stop(t+.5)};
  const bell=(b,t,n,v=.05)=>[1,2.76,5.4].forEach((m,i)=>tone(b,t,hz(n)*m,'sine',v/(i+1),.005,3.5/(i+1),8000));
  const pad=(b,t,n,len,v=.05,type='sawtooth',cut=900)=>{[0,.006].forEach(dt=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.value=hz(n)*(1+dt);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+len*.4);g.gain.linearRampToValueAtTime(0,t+len);o.connect(f);f.connect(g);g.connect(b);o.start(t);o.stop(t+len+.05)})};
  const lfo=(param,rate,depth,t)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g);g.connect(param);o.start(t);return o};

  const scenes={
    lobby:{title:'Лаунж-джаз у входа',dur:60/88/2, // свинг, ii–V–I, контрабас шагом
      ch:[[53,57,60,64],[53,57,59,64],[52,55,59,62],[52,55,58,61]],root:[38,43,36,45],
      step(b,t,i){
        const bar=Math.floor(i/8)%4,s=i%8,sw=s%2?this.dur*.33:0,tt=t+sw,ch=this.ch[bar],r=this.root[bar],nr=this.root[(bar+1)%4];
        if(s%2===0){const beat=s/2;bass(b,tt,beat===0?r:beat===1?r+(bar===2?4:3):beat===2?r+7:nr+(Math.random()<.5?1:-1));brush(b,tt)}
        else ride(b,tt);
        if((s===2||s===5)&&Math.random()<.75)ch.forEach((n,k)=>piano(b,tt+k*.012,n,.045,1.1));
        if(s%2===0&&Math.random()<.22)piano(b,tt,pk(ch)+12+pk([0,2,-1]),.06,1.2);
      }},
    night:{title:'Ночной город',
      start(b,t){const ns=[];[33,40].forEach((n,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(n);f.type='lowpass';f.frequency.value=160;g.gain.value=.09;o.connect(f);f.connect(g);g.connect(b);o.start(t);ns.push(o,lfo(f.frequency,.06+i*.03,60,t))});this.nodes=ns;this.nb=t+2;this.nt=t+5},
      dur:1,
      step(b,t,i){tick(b,t,i%2?.012:.02);if(t>=this.nb){bell(b,t,pk([57,60,64,62,56]),.035);this.nb=t+R(6,11)}if(t>=this.nt){thump(b,t,R(.2,.35),R(45,55));this.nt=t+R(7,12)}}},
    day:{title:'Сицилийский вальс',dur:60/100, // 3/4, мандолина тремоло
      prog:[[45,[57,60,64]],[38,[53,57,62]],[40,[56,59,62,64]],[45,[57,60,64]],[41,[53,57,60]],[38,[53,57,62]],[40,[56,59,62,64]],[45,[57,60,64]]],
      step(b,t,i){
        const bar=Math.floor(i/3)%8,s=i%3,[r,ch]=this.prog[bar];
        if(s===0){bass(b,t,r,.2,.6);if(Math.random()<.8){const m=pk(ch)+12;for(let k=0;k<this.dur*3/.085-1;k++)pluck(b,t+k*.085,k>this.dur*3/.085*.6?m+pk([0,-1,-2]):m,.022*(1-k*.008),.12)}}
        else ch.slice(0,3).forEach(n=>pluck(b,t,n,.03,.35));
      }},
    vote:{title:'Сердцебиение',
      start(b,t){const ns=[];[57,58].forEach((n,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(n);f.type='lowpass';f.frequency.value=600;g.gain.value=.018;o.connect(f);f.connect(g);g.connect(b);o.start(t);ns.push(o,lfo(g.gain,6+i*.7,.016,t),lfo(f.frequency,.05,300,t))});this.nodes=ns;this.t0=t;this.nb=t},
      dur:.25,
      step(b,t){if(t>=this.nb){thump(b,t,.55,55);thump(b,t+.2,.32,50);this.nb=t+Math.max(.55,1.05-(t-this.t0)*.008)}}},
    result:{title:'Тишина после приговора',
      start(b,t){this.nx=t+.2},dur:1,
      step(b,t){if(t>=this.nx){pad(b,t,45,9,.05,'triangle',700);pad(b,t,52,9,.035,'triangle',700);pad(b,t,60,9,.025,'triangle',900);bell(b,t+.5,pk([69,72,64]),.04);this.nx=t+9}}},
    wint:{title:'Город празднует',
      start(b,t){this.nx=t+.2},dur:.5,
      step(b,t){if(t>=this.nx){[60,64,67,72,76,79].forEach((n,k)=>piano(b,t+k*.16,n,.08,2.6));[48,55,64].forEach(n=>pad(b,t+.9,n,6,.05,'triangle',1500));this.nx=t+8}}},
    winm:{title:'Мафия правит',
      start(b,t){this.nx=t+.2},dur:.5,
      step(b,t){if(t>=this.nx){[33,45,48,52].forEach(n=>pad(b,t,n,7,.06,'sawtooth',500));[0,.9,1.8].forEach((d,k)=>thump(b,t+d,.65-k*.1,44-k*3));bell(b,t+2.4,pk([57,56]),.05);this.nx=t+9}}}
  };
  let cur=null,bus=null,timer=null;
  function set(name){
    const t=ctx.currentTime;
    if(cur){const ob=bus,sc=cur;ob.gain.cancelScheduledValues(t);ob.gain.setValueAtTime(ob.gain.value,t);ob.gain.linearRampToValueAtTime(0,t+1.5);setTimeout(()=>{(sc.nodes||[]).forEach(o=>{try{o.stop()}catch(e){}});try{ob.disconnect()}catch(e){}},1800)}
    clearInterval(timer);cur=null;bus=null;
    if(!name||!scenes[name])return;
    const sc=Object.assign({},scenes[name]);bus=ctx.createGain();bus.gain.setValueAtTime(0,t);bus.gain.linearRampToValueAtTime(1,t+1.5);bus.connect(dest);
    if(sc.start)sc.start(bus,t+.05);cur=sc;
    let nt=t+.1,i=0;
    const pump=()=>{const lim=ctx.currentTime+1.2;while(nt<lim){try{sc.step(bus,nt,i)}catch(e){console.error(e)}i++;nt+=sc.dur}};
    pump();timer=setInterval(pump,300);
  }
  return {set,title:n=>scenes[n]?scenes[n].title:''};
}
const SND={ctx:null,eng:null,master:null,on:false,want:lsGet('mf-music')==='1',vol:+(lsGet('mf-vol')||55),scene:null,min:lsGet('mf-sndmin')==='1'};
function sndWanted(){
  if(!SND.on)return null;
  if(!S||MODE!=='ok')return 'lobby';
  if(S.phase==='over')return S.winner==='m'?'winm':'wint';
  return {lobby:'lobby',night:'night',day:'day',vote:'vote',result:'result'}[S.phase]||'lobby';
}
function soundSync(){if(!SND.eng)return;const w=sndWanted();if(w!==SND.scene){SND.scene=w;SND.eng.set(w)}sndUI()}
function sndGain(){if(SND.master)SND.master.gain.value=Math.pow(SND.vol/100,2)*1.3+.0001}
function sndEnsure(){
  if(SND.ctx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{SND.ctx=new AC();SND.master=SND.ctx.createGain();const comp=SND.ctx.createDynamicsCompressor();SND.master.connect(comp);comp.connect(SND.ctx.destination);sndGain();SND.eng=createMusic(SND.ctx,SND.master);return true}catch(e){return false}
}
function sndSet(on){
  if(on&&!sndEnsure()){toast('Этот браузер не умеет играть музыку',true);return}
  SND.on=on;SND.want=on;lsSet('mf-music',on?'1':'0');
  if(on){SND.ctx.resume();SND.scene='__';soundSync()}
  else if(SND.eng){SND.eng.set(null);SND.scene=null;setTimeout(()=>{if(!SND.on)SND.ctx.suspend()},1700)}
  sndUI();
}
function sndUI(){
  let box=document.getElementById('snd');
  if(!box){
    box=document.createElement('div');box.id='snd';
    box.innerHTML='<button id="sndbtn" type="button"></button><div class="trk"><b>Сейчас играет</b><span id="sndtrk"></span></div><input id="sndvol" type="range" min="0" max="100" aria-label="Громкость музыки"><button id="sndmin" type="button" title="Свернуть" aria-label="Свернуть панель музыки">&times;</button><button id="sndopen" type="button" title="Музыка" aria-label="Открыть панель музыки">&#9835;</button>';
    document.body.appendChild(box);
    document.getElementById('sndbtn').onclick=()=>sndSet(!SND.on);
    document.getElementById('sndmin').onclick=()=>{SND.min=true;lsSet('mf-sndmin','1');sndUI()};
    document.getElementById('sndopen').onclick=()=>{SND.min=false;lsSet('mf-sndmin','0');sndUI()};
    document.getElementById('sndvol').oninput=e=>{SND.vol=+e.target.value;sndGain();lsSet('mf-vol',String(SND.vol))};
  }
  const b=document.getElementById('sndbtn');b.textContent=SND.on?'♪ Музыка: вкл':'♪ Музыка: выкл';b.className=SND.on?'on':'';
  b.setAttribute('aria-pressed',SND.on?'true':'false');
  box.classList.toggle('off',!SND.on);box.classList.toggle('min',!!SND.min);
  const op=document.getElementById('sndopen');op.className=SND.on?'on':'';op.title=SND.on?'Музыка играет':'Музыка выключена';
  document.getElementById('sndtrk').textContent=SND.eng&&SND.scene?SND.eng.title(SND.scene):'';
  const v=document.getElementById('sndvol');if(document.activeElement!==v)v.value=SND.vol;
}
sndUI();
// если музыка была включена в прошлый раз, она вернётся после первого нажатия на странице
if(SND.want)document.addEventListener('pointerdown',function f(e){document.removeEventListener('pointerdown',f,true);if(!SND.on&&!(e.target&&e.target.id==='sndbtn'))sndSet(true)},true);

// ===== ВЫБОР ЭКРАНА =====
function view(){
  if(MODE==='choose')return chooserView();
  if(MODE==='connecting')return topbar()+'<section class="panel hot"><h2>Подключаюсь…</h2><p class="muted">'+esc(CONNMSG)+'</p></section>';
  if(MODE==='boot')return topbar()+'<p class="muted">Подключаюсь к игре…</p>';
  if(MODE==='nodb')return topbar()+'<section class="panel hot"><h2>Нет доступа к игре</h2><p>Не удалось подключиться к хранилищу игры. Обновите страницу.</p></section>';
  if(MODE==='noid')return topbar()+'<section class="panel hot"><h2>Не удалось определить аккаунт</h2><p>Войдите в Claude и откройте ссылку ещё раз.</p></section>';
  if(!S)return topbar()+(IS_HOST?hostCreate():'<section class="panel"><h2>Игра ещё не создана</h2><p class="muted">Подождите, пока ведущий её запустит. Страница обновится сама.</p></section>');
  return IS_HOST?hostView():playerView();
}
let CONNMSG='';
const urlCode=()=>{try{const m=((location.hash||'')+(location.search||'')).match(/[A-Za-z0-9]{5}/);return m?m[0].toUpperCase():''}catch(e){return ''}};
function savedHost(){try{const d=JSON.parse(lsGet('mf-host')||'null');return d&&d.code&&d.store?d:null}catch(e){return null}}
async function p2pEnter(sh,role){window.__p2p={role,code:sh.code};window.claude=sh;MODE='boot';await boot()}
H.p2pHost=async()=>{
  MODE='connecting';CONNMSG='Открываю комнату…';render();
  const sh=makeShim('host',newCode());
  try{await sh.startHost(null)}catch(e){MODE='choose';render();toast(e.message,true);return}
  lsSet('mf-host','');await p2pEnter(sh,'host');
};
H.p2pResume=async()=>{
  const sv=savedHost();if(!sv)return;
  MODE='connecting';CONNMSG='Возвращаю прошлую игру…';render();
  const sh=makeShim('host',sv.code);
  try{await sh.startHost(sv)}catch(e){MODE='choose';render();toast(e.message,true);return}
  await p2pEnter(sh,'host');
};
H.p2pJoin=async()=>{
  const code=(val('jcode')||'').trim().toUpperCase();
  if(code.length!==5){toast('Код состоит из 5 символов',true);return}
  MODE='connecting';CONNMSG='Ищу комнату '+code+'…';render();
  const sh=makeShim('player',code);
  try{await sh.connectPlayer()}catch(e){MODE='choose';render();toast(e.message,true);return}
  await p2pEnter(sh,'player');
};
boot();
